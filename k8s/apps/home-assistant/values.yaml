# Runs as a StatefulSet; /config lives on a local-path PVC.
env:
  - name: TZ
    value: Asia/Kolkata

# hostNetwork puts HA on the LAN: needed for device discovery (mDNS/broadcast)
# and to advertise the HomeKit Bridge (TCP 21064) to Apple Home.
# HA listens directly on the node's port 8123.
hostNetwork: true
# Use the node's resolvers rather than CoreDNS. HA doesn't need cluster DNS,
# and this keeps working on nodes where the host can't reach ClusterIPs.
dnsPolicy: Default

service:
  type: ClusterIP
  port: 8080

# Routing is done by our own Traefik IngressRoute (ingress-route.yaml).
# `external: true` creates no Ingress but still renders the reverse-proxy
# settings (use_x_forwarded_for + trusted_proxies) so HA accepts Traefik's requests.
ingress:
  enabled: false
  external: true

configuration:
  enabled: true
  trusted_proxies:
    - 10.42.0.0/16 # k3s pod CIDR (Traefik pods)
    # Node IP: with hostNetwork, Traefik -> HA traffic arrives from it.
    # Update when the node changes.
    # Only applied on fresh installs; existing installs keep /config/.storage/http
    # (edit via Settings -> System -> Network, or that file).
    - 192.168.1.36/32

persistence:
  enabled: true
  storageClass: local-path
  size: 5Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
