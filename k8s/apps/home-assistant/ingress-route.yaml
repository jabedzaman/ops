apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home.lab.jabed.dev`)
      kind: Rule
      services:
        - name: home-assistant
          port: 8080
  tls:
    certResolver: cloudflare
    domains:
      - main: lab.jabed.dev
        sans:
          - "*.lab.jabed.dev"
