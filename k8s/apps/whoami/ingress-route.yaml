apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: whoami
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`whoami.lab.jabed.dev`)
      kind: Rule
      services:
        - name: whoami
          port: 80
  tls:
    certResolver: cloudflare
    domains:
      - main: lab.jabed.dev
        sans:
          - "*.lab.jabed.dev"
