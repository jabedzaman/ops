deployment:
  replicas: 1
ports:
  web:
    port: 80
    exposedPort: 80
    redirectTo:
      port: websecure
  websecure:
    port: 443
    exposedPort: 443
    http3:
      enabled: true
    # One wildcard cert for every *.lab.jabed.dev service, issued via
    # Cloudflare DNS-01 (works without the server being publicly reachable).
    tls:
      enabled: true
      certResolver: cloudflare
      domains:
        - main: lab.jabed.dev
          sans:
            - "*.lab.jabed.dev"
  redis:
    port: 6379
    expose:
      default: true
    exposedPort: 6379
    protocol: TCP
  mongodb:
    port: 27017
    expose:
      default: true
    exposedPort: 27017
    protocol: TCP
service:
  type: LoadBalancer
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`k3s.lab.jabed.dev`)
    entryPoints: ["websecure"]
    middlewares:
      - name: dashboard-auth
        namespace: traefik
additionalArguments:
  - "--certificatesresolvers.cloudflare.acme.email=hi@jabed.dev"
  - "--certificatesresolvers.cloudflare.acme.storage=/data/acme.json"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
  - "--certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: token
persistence:
  enabled: true
  path: /data
  size: 128Mi
logs:
  general:
    level: INFO
  access:
    enabled: true
