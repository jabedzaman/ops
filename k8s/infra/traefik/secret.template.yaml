# Templates for traefik's secrets. Fill in, seal, and save the output as the
# matching sealed-secret-*.yaml (see CLAUDE.md "Sealing a Secret").
---
apiVersion: v1
kind: Secret
metadata:
  name: traefik-dashboard-auth-token
  namespace: traefik
type: Opaque
stringData:
  traefik-dashboard-auth: "your-traefik-dashboard-auth-token-here"
---
# Cloudflare API token for the ACME DNS-01 challenge.
# Permissions: Zone -> DNS -> Edit, scoped to jabed.dev.
# Save the sealed output as sealed-secret-cloudflare-api-token.yaml
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: traefik
type: Opaque
stringData:
  token: "your-cloudflare-api-token-here"
