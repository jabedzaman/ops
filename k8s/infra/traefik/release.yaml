bases:
  - ../../bases/repositories.yaml
  - ../../bases/templates.yaml

releases:
  # Sealed secrets are applied presync: traefik reads CF_DNS_API_TOKEN from
  # the cloudflare-api-token secret at boot. middleware.yaml is a traefik CRD,
  # so it's applied postsync once the chart has installed the CRDs.
  - name: traefik
    namespace: traefik
    chart: traefik/traefik
    version: ~28.0.0
    inherit:
      - template: default
    values:
      - values.yaml
